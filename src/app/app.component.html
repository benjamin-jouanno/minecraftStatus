<main class="page-shell">
  <div class="scene" aria-hidden="true"></div>
  <section class="server-card" [class.is-offline]="!online" aria-labelledby="server-name">
    <header class="card-header"><div class="title-row"><div class="grass-block" [class.has-server-icon]="icon" [style.background-image]="icon ? 'url(' + icon + ')' : null" aria-hidden="true"><i></i></div><h1 id="server-name">Benjamin's Homestead Server</h1></div><button class="close-button" aria-label="Close status panel">×</button></header>
    <div class="server-summary"><div class="connection-state"><span class="status-dot"></span><strong>{{ online ? 'ONLINE' : 'OFFLINE' }}</strong></div><p>{{ host }}:{{ port }}<br><span>{{ version }}</span></p></div>
    <div class="card-body"><div class="count-card"><svg viewBox="0 0 76 64" class="players-icon" aria-hidden="true"><path d="M25 30a10 10 0 1 0 0-20 10 10 0 0 0 0 20Zm26 0a10 10 0 1 0 0-20 10 10 0 0 0 0 20ZM38 24a12 12 0 1 0 0-24 12 12 0 0 0 0 24ZM8 54v-7c0-9 7-16 16-16h3c9 0 16 7 16 16v7H8Zm26 0v-9c0-9 7-16 16-16h3c9 0 16 7 16 16v9H34Zm-22 9v-8c0-10 8-18 18-18h16c10 0 18 8 18 18v8H12Z" /></svg><div><div class="count">{{ playerCount }} / {{ playerMax }}</div><p>PLAYERS ONLINE</p></div></div>
      <div class="player-list" aria-label="Online players"><article class="player" *ngFor="let player of players; let i = index"><span class="avatar" [style.background]="skins[i % skins.length]"></span><span class="player-name">{{ player }}</span><span class="status-dot" title="Online"></span></article><article class="player" *ngIf="!players.length"><span class="player-name">{{ online ? 'No player names exposed by server' : 'No connection to server' }}</span></article></div></div>
    <footer class="stats-bar"><div class="metric"><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><b>{{ ping }}</b><small>PING</small></div></div><div class="metric"><span class="server-glyph" aria-hidden="true">▤</span><div><b>{{ version }}</b><small>VERSION</small></div></div><div class="metric"><span class="refresh-glyph" aria-hidden="true">⟳</span><div><b>5 s</b><small>REFRESH</small></div></div></footer>
  </section>
</main>
