<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1315" />
    <title>Minecraft Server Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="scene" aria-hidden="true"></div>

      <section class="server-card" aria-labelledby="server-name">
        <header class="card-header">
          <div class="title-row">
            <div class="grass-block" id="server-icon" aria-hidden="true"><i></i></div>
            <h1 id="server-name">Benjamin's Homestead Server</h1>
          </div>
          <button class="close-button" aria-label="Close status panel">×</button>
        </header>

        <div class="server-summary">
          <div class="connection-state"><span class="status-dot"></span><strong id="status-text">CHECKING</strong></div>
          <p id="server-address">169.155.122.96:9130<br /><span id="server-details">Connecting…</span></p>
        </div>

        <div class="card-body">
          <div class="count-card">
            <svg viewBox="0 0 76 64" class="players-icon" aria-hidden="true"><path d="M25 30a10 10 0 1 0 0-20 10 10 0 0 0 0 20Zm26 0a10 10 0 1 0 0-20 10 10 0 0 0 0 20ZM38 24a12 12 0 1 0 0-24 12 12 0 0 0 0 24ZM8 54v-7c0-9 7-16 16-16h3c9 0 16 7 16 16v7H8Zm26 0v-9c0-9 7-16 16-16h3c9 0 16 7 16 16v9H34Zm-22 9v-8c0-10 8-18 18-18h16c10 0 18 8 18 18v8H12Z" /></svg>
            <div><div class="count"><span id="online-count">4</span> / <span id="max-count">20</span></div><p>PLAYERS ONLINE</p></div>
          </div>

          <div class="player-list" id="player-list" aria-label="Online players"></div>
        </div>

        <footer class="stats-bar">
          <div class="metric"><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><b id="ping">32 ms</b><small>PING</small></div></div>
          <div class="metric"><span class="server-glyph" aria-hidden="true">▤</span><div><b id="version">1.21.1</b><small>VERSION</small></div></div>
          <div class="metric"><span class="refresh-glyph" aria-hidden="true">⟳</span><div><b>5 s</b><small>REFRESH</small></div></div>
        </footer>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
